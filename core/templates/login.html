{% extends 'base.html' %}
{% block title %}Entrar · GameHub{% endblock %}
{% block content %}
<div class="box">
  <h2>Iniciar sesión</h2>
  <form method="post">
    {% include '_form.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <p><button class="btn" type="submit">Entrar</button></p>
  </form>
  <p class="mut">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
</div>
{% endblock %}
