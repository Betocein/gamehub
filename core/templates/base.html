<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GameHub{% endblock %}</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--acc:#7c5cff;--acc2:#22d3a6;--txt:#e8eaf6;--mut:#9aa3c7;--err:#ff6b81}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}
a{color:var(--acc2);text-decoration:none}
nav{display:flex;gap:18px;align-items:center;padding:14px 6vw;background:#0b0e1a;border-bottom:1px solid #262c4d}
nav .logo{font-weight:700;font-size:20px;color:var(--txt);margin-right:auto}nav form{margin:0}
main{max-width:1000px;margin:0 auto;padding:32px 20px}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--acc2);color:var(--acc2)}
.link{background:none;border:0;color:var(--acc2);font-size:15px;cursor:pointer;padding:0}
.hero{text-align:center;padding:50px 0}.hero h1{font-size:40px;margin:0 0 10px}.hero p{color:var(--mut);max-width:560px;margin:0 auto 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border-radius:12px;overflow:hidden}.card .body{padding:14px}.card h3{margin:0 0 6px;font-size:16px}
.card img{width:100%;height:130px;object-fit:cover;display:block;background:#262c4d}.mut{color:var(--mut);font-size:13px}
.box{max-width:420px;margin:0 auto;background:var(--card);padding:26px;border-radius:12px}
.box label{display:block;margin:14px 0 4px;font-size:14px}.box input{width:100%;padding:10px;border-radius:8px;border:1px solid #333b66;background:#0f1220;color:var(--txt)}
.errorlist{list-style:none;padding:0;margin:4px 0 0;color:var(--err);font-size:13px}.helptext{color:var(--mut);font-size:12px}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:16px;background:#12362f;color:var(--acc2)}.msg.error{background:#3a1822;color:var(--err)}
.search{display:flex;gap:10px;margin:18px 0 24px}.search input{flex:1;padding:10px;border-radius:8px;border:1px solid #333b66;background:var(--card);color:var(--txt)}
</style>
</head>
<body>
<nav>
  <a class="logo" href="{% url 'home' %}">🎮 GameHub</a>
  <a href="{% url 'home' %}">Inicio</a>
  <a href="{% url 'games' %}">Juegos</a>
  {% if user.is_authenticated %}
    <span class="mut">Hola, {{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link">Salir</button></form>
  {% else %}
    <a href="{% url 'login' %}">Entrar</a>
    <a class="btn" href="{% url 'register' %}">Registrarse</a>
  {% endif %}
</nav>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
